name: PR Test (HCU)

on:
  # Label-triggered: a maintainer adding `run-ci` starts HCU PR CI. Opening,
  # pushing, reopening or marking the PR ready for review no longer does.
  pull_request_target:
    branches:
      - main
    types:
      - labeled
    paths:
      - "hcu_verl/**"
      - "tests/hcu/**"
      - ".github/workflows/pr-test-hcu.yml"
      - ".gitmodules"
      - "third_party/verl"
      - "third_party/Megatron-LM"
      - "third_party/VeOmni"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  # Unrelated label events get a throwaway group: they skip every job and must
  # not cancel or queue behind the HCU run they share a PR with.
  group: pr-test-hcu-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.run_id || 'checks' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERL_HCU_CI_IMAGE: ${{ vars.VERL_HCU_CI_IMAGE }}

jobs:
  unit:
    name: HCU unit tests
    # HCU CI runs only when `run-ci` is added (the workflow accepts no other
    # PR event); unrelated label additions skip the whole graph.
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'run-ci'
    # ARC K8s pool: the job template provides the eight HCU devices, /dev/shm,
    # /opt/hyhal, /public and /ci_public, and the job runs inside the CI image
    # (no docker-in-job).
    runs-on: hygon-bw1100-8card
    timeout-minutes: 90
    container:
      image: ${{ vars.VERL_HCU_CI_IMAGE }}
    env:
      VERL_HCU_CI_RUN_ID: unit-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_LOG_DIR: ci-logs/unit-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_SOURCE_REPOSITORY: >-
        ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      VERL_HCU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
      VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
      GLOG_minloglevel: 3
      PYTHONWARNINGS: ignore
      TORCH_CPP_LOG_LEVEL: fatal
      TRANSFORMERS_VERBOSITY: error
      VLLM_CUDART_SO_PATH: /opt/dtk/hip/lib/libgalaxyhip.so
    steps:
      - name: Authorize PR source
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "HCU execution authorized for ${HEAD_REPOSITORY} targeting ${BASE_REPOSITORY}."

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          clean: true
          persist-credentials: false

      - name: Validate HCU configuration
        env:
          VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
          VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          python3 tests/hcu/ci/check_environment.py config

      - name: Install optional HCU unit-test dependencies
        shell: bash
        run: >-
          python3 -m pip install --no-cache-dir
          --index-url https://pypi.tuna.tsinghua.edu.cn/simple
          TransferQueue==0.1.9 mlflow

      - name: Run HCU unit tests
        timeout-minutes: 60
        shell: bash
        run: bash tests/hcu/pr/run_hcu_unit_tests.sh

      - name: Cleanup HCU CI resources
        if: always()
        shell: bash
        run: bash tests/hcu/ci/cleanup.sh

  runtime:
    name: HCU smoke and vLLM one-step
    needs:
      - unit
    # ARC K8s pool, same container/device injection as the unit job.
    runs-on: hygon-bw1100-8card
    timeout-minutes: 60
    container:
      image: ${{ vars.VERL_HCU_CI_IMAGE }}
    env:
      VERL_HCU_CI_RUN_ID: runtime-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_LOG_DIR: ci-logs/runtime-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_SOURCE_REPOSITORY: >-
        ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      VERL_HCU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
      VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
    steps:
      - name: Checkout repository and fixed submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          clean: true
          persist-credentials: false

      - name: Run HCU smoke
        timeout-minutes: 20
        shell: bash
        run: bash tests/hcu/pr/run_hcu_smoke.sh

      - name: Reset smoke resources
        shell: bash
        run: bash tests/hcu/ci/cleanup.sh

      - name: Run HCU vLLM GRPO one-step E2E
        timeout-minutes: 30
        shell: bash
        run: bash tests/hcu/pr/run_vllm_grpo_1step.sh

      - name: Cleanup HCU CI resources
        if: always()
        shell: bash
        run: bash tests/hcu/ci/cleanup.sh

  finish:
    name: Finish
    # Keep the aggregate check from turning unrelated label events red.
    if: always() && (github.event_name != 'pull_request_target' || github.event.label.name == 'run-ci')
    needs:
      - unit
      - runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail

          [[ "${UNIT_RESULT}" == "success" ]]
          [[ "${RUNTIME_RESULT}" == "success" ]]

          {
            echo "## HCU PR gate"
            echo
            echo "- HCU unit tests: ${UNIT_RESULT}"
            echo "- smoke and vLLM one-step: ${RUNTIME_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"

name: PR Test (HCU)

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-test-hcu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan HCU tests
    runs-on:
      - self-hosted
      - bw1000
      - ${{ vars.VERL_HCU_CI_RUNNER_LABEL || 'hcu-ci-unconfigured' }}
    timeout-minutes: 10
    outputs:
      profile: ${{ steps.changes.outputs.profile }}
      runtime: ${{ steps.changes.outputs.runtime }}
      unit: ${{ steps.changes.outputs.unit }}
    env:
      VERL_HCU_CI_IMAGE: ${{ vars.VERL_HCU_PR_IMAGE }}
    steps:
      - name: Authorize PR source
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "HCU execution authorized for ${HEAD_REPOSITORY} targeting ${BASE_REPOSITORY}."

      - name: Restore existing workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in
            "${work_root}"/*/*) ;;
            *)
              echo "ERROR: refusing to change ownership outside ${work_root}: ${workspace}" >&2
              exit 1
              ;;
          esac

          owner="$(stat -c '%u:%g' -- "${runner_temp}")"
          if [[ ! "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]; then
            echo "ERROR: unsafe runner ownership: ${owner}" >&2
            exit 1
          fi
          if [[ ! "${VERL_HCU_CI_IMAGE}" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: VERL_HCU_PR_IMAGE must use an immutable sha256 digest" >&2
            exit 1
          fi

          docker run --rm \
            --volume "${workspace}:/workspace" \
            "${VERL_HCU_CI_IMAGE}" \
            chown -R -- "${owner}" /workspace

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${BASE_SHA}" ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" |
            "${HOME}/.local/bin/python3.10" tests/hcu/ci/plan_pr.py \
              --github-output "${GITHUB_OUTPUT}"

      - name: Validate HCU configuration
        if: steps.changes.outputs.runtime == 'true' || steps.changes.outputs.unit == 'true'
        env:
          VERL_HCU_CI_RUNNER_LABEL: ${{ vars.VERL_HCU_CI_RUNNER_LABEL }}
          VERL_HCU_PR_IMAGE: ${{ vars.VERL_HCU_PR_IMAGE }}
          VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
          VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
        run: >-
          "${HOME}/.local/bin/python3.10"
          tests/hcu/ci/check_environment.py config --profile pr

  unit:
    name: HCU unit and upstream tests
    needs:
      - plan
    if: needs.plan.outputs.unit == 'true'
    runs-on:
      - self-hosted
      - bw1000
      - ${{ vars.VERL_HCU_CI_RUNNER_LABEL || 'hcu-ci-unconfigured' }}
    timeout-minutes: 90
    env:
      VERL_HCU_CI_CONTAINER_NAME: verl-hcu-pr-unit-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_RUN_ID: unit-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_LOG_DIR: ci-logs/unit-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_IMAGE: ${{ vars.VERL_HCU_PR_IMAGE }}
      VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
      VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
      GLOG_minloglevel: 3
      PYTHONWARNINGS: ignore
      TORCH_CPP_LOG_LEVEL: fatal
      TRANSFORMERS_VERBOSITY: error
      VLLM_CUDART_SO_PATH: /opt/dtk/hip/lib/libgalaxyhip.so
    steps:
      - name: Checkout repository and fixed submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Start HCU unit container
        shell: bash
        run: bash tests/hcu/ci/start_container.sh

      - name: Run pinned upstream sanity and CPU tests
        if: needs.plan.outputs.runtime == 'true'
        timeout-minutes: 10
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/pr/run_upstream_pr_tests.sh

      - name: Install TransferQueue for HCU unit tests
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh
          --env PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple --
          python3 -m pip install --no-cache-dir TransferQueue==0.1.9

      - name: Run HCU unit tests
        timeout-minutes: 60
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/pr/run_hcu_unit_tests.sh

      - name: Cleanup HCU unit container
        if: always()
        shell: bash
        run: bash tests/hcu/ci/cleanup_container.sh

      - name: Upload unit test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verl-hcu-pr-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: HCU smoke and vLLM one-step
    needs:
      - plan
      - unit
    if: needs.plan.outputs.runtime == 'true' && needs.unit.result == 'success'
    runs-on:
      - self-hosted
      - bw1000
      - ${{ vars.VERL_HCU_CI_RUNNER_LABEL || 'hcu-ci-unconfigured' }}
    timeout-minutes: 60
    env:
      VERL_HCU_CI_CONTAINER_NAME: verl-hcu-pr-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_RUN_ID: runtime-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_LOG_DIR: ci-logs/runtime-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_IMAGE: ${{ vars.VERL_HCU_PR_IMAGE }}
      VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
      VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
    steps:
      - name: Checkout repository and fixed submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Start HCU runtime container
        shell: bash
        run: bash tests/hcu/ci/start_container.sh

      - name: Run HCU smoke
        timeout-minutes: 20
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/pr/run_hcu_smoke.sh

      - name: Reset smoke resources
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/ci/cleanup.sh

      - name: Run HCU vLLM GRPO one-step E2E
        timeout-minutes: 30
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/pr/run_vllm_grpo_1step.sh

      - name: Cleanup HCU runtime container
        if: always()
        shell: bash
        run: bash tests/hcu/ci/cleanup_container.sh

      - name: Upload runtime test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verl-hcu-pr-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

  finish:
    name: Finish
    if: always()
    needs:
      - plan
      - unit
      - runtime
    runs-on:
      - self-hosted
      - bw1000
      - ${{ vars.VERL_HCU_CI_RUNNER_LABEL || 'hcu-ci-unconfigured' }}
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          RUNTIME_CHANGED: ${{ needs.plan.outputs.runtime }}
          UNIT_CHANGED: ${{ needs.plan.outputs.unit }}
          TEST_PROFILE: ${{ needs.plan.outputs.profile }}
          PLAN_RESULT: ${{ needs.plan.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail

          [[ "${PLAN_RESULT}" == "success" ]]
          if [[ "${UNIT_CHANGED}" == "true" ]]; then
            [[ "${UNIT_RESULT}" == "success" ]]
          else
            [[ "${UNIT_RESULT}" == "skipped" ]]
          fi
          if [[ "${RUNTIME_CHANGED}" == "true" ]]; then
            [[ "${RUNTIME_RESULT}" == "success" ]]
          else
            [[ "${RUNTIME_RESULT}" == "skipped" ]]
          fi

          {
            echo "## HCU PR gate"
            echo
            echo "- selected profile: ${TEST_PROFILE}"
            echo "- runtime changed: ${RUNTIME_CHANGED}"
            echo "- unit-test paths changed: ${UNIT_CHANGED}"
            echo "- plan: ${PLAN_RESULT}"
            echo "- unit and upstream tests: ${UNIT_RESULT}"
            echo "- smoke and vLLM one-step: ${RUNTIME_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"

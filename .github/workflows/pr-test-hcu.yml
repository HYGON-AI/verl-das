name: PR Test (HCU)

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "hcu_verl/**"
      - "tests/hcu/**"
      - ".github/workflows/pr-test-hcu.yml"
      - ".gitmodules"
      - "third_party/verl"
      - "third_party/Megatron-LM"
      - "third_party/VeOmni"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: pr-test-hcu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERL_HCU_CI_IMAGE: ${{ vars.VERL_HCU_CI_IMAGE }}

jobs:
  unit:
    name: HCU unit tests
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 90
    env:
      VERL_HCU_CI_CONTAINER_NAME: verl-hcu-pr-unit-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_RUN_ID: unit-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_LOG_DIR: ci-logs/unit-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_SOURCE_REPOSITORY: >-
        ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      VERL_HCU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
      VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
      GLOG_minloglevel: 3
      PYTHONWARNINGS: ignore
      TORCH_CPP_LOG_LEVEL: fatal
      TRANSFORMERS_VERBOSITY: error
      VLLM_CUDART_SO_PATH: /opt/dtk/hip/lib/libgalaxyhip.so
    steps:
      - name: Restore existing workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in
            "${work_root}"/*/*) ;;
            *)
              echo "ERROR: refusing to change ownership outside ${work_root}: ${workspace}" >&2
              exit 1
              ;;
          esac

          owner="$(stat -c '%u:%g' -- "${runner_temp}")"
          if [[ ! "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]; then
            echo "ERROR: unsafe runner ownership: ${owner}" >&2
            exit 1
          fi
          if [[ -z "${VERL_HCU_CI_IMAGE}" ]]; then
            echo "ERROR: VERL_HCU_CI_IMAGE is required" >&2
            exit 1
          fi

          docker run --rm \
            --user root \
            --volume "${workspace}:/workspace" \
            "${VERL_HCU_CI_IMAGE}" \
            chown -R -- "${owner}" /workspace

      - name: Authorize PR source
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "HCU execution authorized for ${HEAD_REPOSITORY} targeting ${BASE_REPOSITORY}."

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          clean: true
          persist-credentials: false

      - name: Validate HCU configuration
        env:
          VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
          VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env VERL_HCU_CI_IMAGE \
            --env VERL_HCU_MODEL_ROOT \
            --env VERL_HCU_DATA_ROOT \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            "${VERL_HCU_CI_IMAGE}" \
            python3 tests/hcu/ci/check_environment.py config

      - name: Start HCU unit container
        shell: bash
        run: bash tests/hcu/ci/start_container.sh

      - name: Install optional HCU unit-test dependencies
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh
          --env PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple --
          python3 -m pip install --no-cache-dir TransferQueue==0.1.9 mlflow

      - name: Run HCU unit tests
        timeout-minutes: 60
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/pr/run_hcu_unit_tests.sh

      - name: Cleanup HCU unit container
        if: always()
        shell: bash
        run: bash tests/hcu/ci/cleanup_container.sh

      - name: Upload unit test logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verl-hcu-pr-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: HCU smoke and vLLM one-step
    needs:
      - unit
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 60
    env:
      VERL_HCU_CI_CONTAINER_NAME: verl-hcu-pr-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_RUN_ID: runtime-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_LOG_DIR: ci-logs/runtime-pr-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_SOURCE_REPOSITORY: >-
        ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      VERL_HCU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
      VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
    steps:
      - name: Checkout repository and fixed submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          clean: true
          persist-credentials: false

      - name: Start HCU runtime container
        shell: bash
        run: bash tests/hcu/ci/start_container.sh

      - name: Run HCU smoke
        timeout-minutes: 20
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/pr/run_hcu_smoke.sh

      - name: Reset smoke resources
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/ci/cleanup.sh

      - name: Run HCU vLLM GRPO one-step E2E
        timeout-minutes: 30
        shell: bash
        run: >-
          bash tests/hcu/ci/exec_container.sh --
          bash tests/hcu/pr/run_vllm_grpo_1step.sh

      - name: Cleanup HCU runtime container
        if: always()
        shell: bash
        run: bash tests/hcu/ci/cleanup_container.sh

      - name: Upload runtime test logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verl-hcu-pr-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

  finish:
    name: Finish
    if: always()
    needs:
      - unit
      - runtime
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 5
    steps:
      - name: Evaluate required jobs
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail

          [[ "${UNIT_RESULT}" == "success" ]]
          [[ "${RUNTIME_RESULT}" == "success" ]]

          {
            echo "## HCU PR gate"
            echo
            echo "- HCU unit tests: ${UNIT_RESULT}"
            echo "- smoke and vLLM one-step: ${RUNTIME_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"

name: Nightly Test (HCU)

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      test_case:
        description: all, engine name, case id, or comma-separated values
        required: true
        default: all
        type: string

concurrency:
  group: nightly-test-hcu
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERL_HCU_VLLM_IMAGE: >-
    harbor.sourcefind.cn:5443/dcu/admin/base/custom:verl-das-vllm0.25.1-ubuntu22.04-dtk2604-py3.10-20260825-0031
  VERL_HCU_SGLANG_IMAGE: ${{ vars.VERL_HCU_SGLANG_IMAGE }}
  VERL_HCU_MODEL_ROOT: ${{ vars.VERL_HCU_MODEL_ROOT }}
  VERL_HCU_DATA_ROOT: ${{ vars.VERL_HCU_DATA_ROOT }}
  VERL_HCU_CI_TMP_ROOT: /tmp/verl-hcu-ci
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  WANDB_MODE: disabled
  TOKENIZERS_PARALLELISM: "false"

jobs:
  plan:
    name: Plan nightly cases
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
      selected: ${{ steps.cases.outputs.selected }}
    steps:
      - name: Restore existing workspace ownership
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in
            "${work_root}"/*/*) ;;
            *)
              echo "ERROR: refusing to change ownership outside ${work_root}: ${workspace}" >&2
              exit 1
              ;;
          esac

          owner="$(stat -c '%u:%g' -- "${runner_temp}")"
          if [[ ! "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]; then
            echo "ERROR: unsafe runner ownership: ${owner}" >&2
            exit 1
          fi
          if [[ -z "${VERL_HCU_VLLM_IMAGE}" ]]; then
            echo "ERROR: VERL_HCU_VLLM_IMAGE is required" >&2
            exit 1
          fi

          docker run --rm \
            --user root \
            --volume "${workspace}:/workspace" \
            "${VERL_HCU_VLLM_IMAGE}" \
            chown -R -- "${owner}" /workspace

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Validate nightly configuration
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env VERL_HCU_VLLM_IMAGE \
            --env VERL_HCU_SGLANG_IMAGE \
            --env VERL_HCU_MODEL_ROOT \
            --env VERL_HCU_DATA_ROOT \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            "${VERL_HCU_VLLM_IMAGE}" \
            python3 tests/hcu/ci/check_environment.py config --profile nightly

      - name: Build nightly matrix
        id: cases
        shell: bash
        env:
          SELECTED_CASE: ${{ inputs.test_case || 'all' }}
        run: |
          set -euo pipefail

          matrix="$(docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            "${VERL_HCU_VLLM_IMAGE}" \
            python3 tests/hcu/ci/plan_nightly.py --select "${SELECTED_CASE}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "selected=${SELECTED_CASE}" >> "${GITHUB_OUTPUT}"
          echo "Nightly matrix: ${matrix}"

  nightly:
    name: ${{ matrix.name }}
    needs:
      - plan
    if: needs.plan.result == 'success'
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERL_HCU_CI_CONTAINER_NAME: verl-hcu-nightly-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_RUN_ID: nightly-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      VERL_HCU_CI_LOG_DIR: ci-logs/nightly-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository and fixed submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Start nightly container
        shell: bash
        env:
          VERL_HCU_CI_IMAGE: >-
            ${{ matrix.image_profile == 'vllm' && env.VERL_HCU_VLLM_IMAGE || env.VERL_HCU_SGLANG_IMAGE }}
        run: bash tests/hcu/ci/start_container.sh

      - name: Run ${{ matrix.name }}
        shell: bash
        env:
          CASE_ENGINE: ${{ matrix.engine }}
          CASE_EXPECTED_STEP: ${{ matrix.expected_step }}
          CASE_ID: ${{ matrix.id }}
          CASE_MODEL_PARENT: ${{ matrix.model_parent }}
          CASE_MODEL_PATH: ${{ matrix.model_path }}
          CASE_REQUIRED_GPUS: ${{ matrix.required_gpus }}
          CASE_REQUIRES_GALAXYHIP: ${{ matrix.requires_galaxyhip }}
          CASE_SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail

          bash tests/hcu/ci/exec_container.sh \
            --env "CASE_ENGINE=${CASE_ENGINE}" \
            --env "CASE_EXPECTED_STEP=${CASE_EXPECTED_STEP}" \
            --env "CASE_ID=${CASE_ID}" \
            --env "CASE_MODEL_PARENT=${CASE_MODEL_PARENT}" \
            --env "CASE_MODEL_PATH=${CASE_MODEL_PATH}" \
            --env "CASE_REQUIRED_GPUS=${CASE_REQUIRED_GPUS}" \
            --env "CASE_REQUIRES_GALAXYHIP=${CASE_REQUIRES_GALAXYHIP}" \
            --env "CASE_SCRIPT=${CASE_SCRIPT}" \
            -- bash tests/hcu/nightly/run_case.sh

      - name: Cleanup nightly container
        if: always()
        shell: bash
        run: bash tests/hcu/ci/cleanup_container.sh

      - name: Upload nightly logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verl-hcu-nightly-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

  finish:
    name: Finish
    if: always()
    needs:
      - plan
      - nightly
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 5
    steps:
      - name: Evaluate nightly jobs
        shell: bash
        env:
          SELECTED_CASE: ${{ needs.plan.outputs.selected || inputs.test_case || 'all' }}
          PLAN_RESULT: ${{ needs.plan.result }}
          NIGHTLY_RESULT: ${{ needs.nightly.result }}
        run: |
          set -euo pipefail

          [[ "${PLAN_RESULT}" == "success" ]]
          [[ "${NIGHTLY_RESULT}" == "success" ]]
          {
            echo "## HCU Nightly"
            echo
            echo "- selected cases: ${SELECTED_CASE}"
            echo "- plan: ${PLAN_RESULT}"
            echo "- model matrix: ${NIGHTLY_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"
